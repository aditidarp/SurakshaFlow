<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Settings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      color: #fff;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0056b3;
    }

    .note {
      margin-top: 15px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2><i class="fa fa-gear"></i> Admin Settings</h2>

    <form>
      <div class="form-group">
        <label>Admin Name</label>
        <input type="text" placeholder="Enter admin name" />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" placeholder="Enter email" />
      </div>

      <div class="form-group">
        <label>Change Password</label>
        <input type="password" placeholder="New password" />
      </div>

      <div class="form-group">
        <label>Theme</label>
        <select>
          <option>Light</option>
          <option>Dark</option>
        </select>
      </div>

      <button class="btn" type="submit">
        <i class="fa fa-save"></i> Save Settings
      </button>
    </form>

    <div class="note">
      Changes will be applied after saving
    </div>
  </div>

</body>
</html>
